# Netlify hosts the FRONTEND ONLY. The API stays on the Pi.
#
# Tailscale Funnel cannot serve a custom domain — it only answers on *.ts.net —
# so the static build goes here at vantage.nickward.co.uk and calls back to the
# Pi's Funnel URL. Same split sara.nickward.co.uk already uses.
#
# Redirects and headers deliberately live in frontend/public/_redirects and
# _headers rather than here. Those files travel INTO the build output, so a CLI
# deploy of a prebuilt directory carries them too — declaring them here as well
# would give two sources that drift apart silently.

[build]
  base    = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Netlify serves from a host root; the Pi serves the same app under /vantage.
  VANTAGE_BASE = "/"
  # The API is not here. It is on the Pi, reachable over Tailscale Funnel.
  VITE_API_BASE = "https://pi5.tailecb90f.ts.net/vantage/api"
